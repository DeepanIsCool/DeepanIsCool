name: refresh isocalendar

# Separate from stats.yml on purpose: this one depends on a third-party action
# and, for private-contribution totals, on a PAT. Keeping it apart means a
# failure here never blocks the graphics we draw ourselves.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-isocalendar
  cancel-in-progress: false

jobs:
  isocalendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Pinned rather than @latest: this action runs with a token, so an
      # upstream change should be something we opt into, not something that
      # arrives overnight.
      #
      # output_action: none leaves the file in the workspace instead of
      # committing it, so the restyle below lands in the same commit rather
      # than as a second one undoing the first.
      - name: Draw the isometric year
        uses: lowlighter/metrics@v3.34
        with:
          # Falls back to the built-in token, which can still see public
          # contributions — it just can't count private ones.
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: DeepanIsCool
          filename: isocalendar.svg
          base: ""
          output_action: none
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # output_action: none leaves the render in /metrics_renders (a host
      # volume the action creates), not in the workspace — so copy it in
      # before restyling, or the step silently re-reads the committed file
      # and reports "already restyled".
      - name: Match it to the page
        run: |
          cp /metrics_renders/isocalendar.svg isocalendar.svg
          python3 scripts/restyle_isocalendar.py

      - name: Commit whatever changed
        run: |
          if [ -z "$(git status --porcelain -- isocalendar.svg)" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- isocalendar.svg
          git commit -m "stats: refresh isocalendar"
          git push
